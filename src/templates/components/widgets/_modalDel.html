<div class="modal modal--del js-del-modal">
    <div class="modal__box js-del-box">
        <button type="button" class="modal__close js-del-close">
            <svg width="24" height="25" viewBox="0 0 24 25" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M0.784524 23.1376L12 11.9221M12 11.9221L0.784525 0.706686M12 11.9221L23.2154 0.706649M12 11.9221L23.2154 23.1375"
                    stroke="#537896" stroke-width="2" />
            </svg>
        </button>
        {{> _titleBuilder
        className = 'section-title'
        tagWrapper = 'p'
        label = 'Видалити акаунт'
        }}
        <p class="modal__subtitle">
            Ви впевнені, що хочете видалити свій аккаунт?
        </p>
        <div class="del-controls">
            <button type="button" class="link-accent js-del-close"><span>Видалити</span></button>
            <button type="button" class="link-secondary js-del-close">
                <span class="border-gradient">
                    Скасувати
                </span>
            </button>
        </div>
    </div>
</div>
