<div class="ticker-logos">
    <div class="ticker-logos__marquee">
        <div class="ticker-logos__track" aria-hidden="false">
            {{#each brands.brands}}
                <img src="{{ pic }}" alt="Brand">
            {{/each}}
        </div>
        <div class="ticker-logos__track" aria-hidden="true">
            {{#each brands.brands}}
                <img src="{{ pic }}" alt="Brand">
            {{/each}}
        </div>
    </div>
</div>
