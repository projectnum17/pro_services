<div class="service-box cross-block cross-block--br">
    <div class="service-box__thumb">
        <img loading="lazy" decoding="async" src="{{ picSource }}" alt="Picture">
    </div>
    <div class="service-box__info">
        <div class="service-box__about">
            <h3>{{ title }}</h3>
            <p>{{ subtitle }}</p>
        </div>
        <p class="service-box__tag">{{ tag }}</p>
    </div>
</div>
