<div class="rating-group">
    <p class="rating-group__title">Ваша оцінка *</p>
    <div class="rating">
        <input class="rating__input" type="radio" name="rating" id="star5" value="5">
        <label class="rating__label" for="star5">
            {{> _iconStar}}
        </label>

        <input class="rating__input" type="radio" name="rating" id="star4" value="4">
        <label class="rating__label" for="star4">
            {{> _iconStar}}
        </label>

        <input class="rating__input" type="radio" name="rating" id="star3" value="3">
        <label class="rating__label" for="star3">
            {{> _iconStar}}
        </label>

        <input class="rating__input" type="radio" name="rating" id="star2" value="2">
        <label class="rating__label" for="star2">
            {{> _iconStar}}
        </label>

        <input class="rating__input" type="radio" name="rating" id="star1" value="1" required>
        <label class="rating__label" for="star1">
            {{> _iconStar}}
        </label>
    </div>
</div>
